jenkins:
  systemMessage: "ClaudeClang CI (Jenkins LTS)"
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

unclassified:
  location:
    url: "http://localhost:8080/"

jobs:
  - script: |
      // 정기 실행 전용 잡. PR/브랜치 CI는 GitHub Actions(.github/workflows/ci.yml)가 맡고,
      // Jenkins는 develop을 주기적으로 검증해 결과(JUnit, Cppcheck, 커버리지, HTML)를 보관한다.
      pipelineJob('ClaudeClang-periodic') {
        displayName('ClaudeClang 정기 실행 (develop)')
        definition {
          cpsScm {
            scm {
              git {
                remote { url('https://github.com/jhpark0126/ClaudeClang.git') }
                branch('*/develop')
              }
            }
            scriptPath('Jenkinsfile')
            lightweight(false)
          }
        }
        triggers {
          // 6시간마다 (H는 분을 분산시킨다). 새 커밋이 없어도 실행한다.
          cron('H H/6 * * *')
        }
      }
